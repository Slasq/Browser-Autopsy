[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-autopsy"
version = "1.0.0"
description = "Offline DFIR analyzer for Chrome and Firefox browser artifacts"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
browser-autopsy = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "samples*"]
